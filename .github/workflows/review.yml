# .github/workflows/review.yml
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r .github/workflows/requirements.txt

      - name: Fetch full git history
        run: git fetch --unshallow

      - name: Run AI code review
        run: python .github/workflows/ai_review.py
        env:
          # Proxy API credentials
          PROXYAPI_KEY: ${{ secrets.PROXYAPI_KEY }}
          PROXYAPI_URL: ${{ secrets.PROXYAPI_URL }}       # e.g. https://api.proxyapi.ru/v1
          
          # OpenAI model (optional override)
          OPENAI_MODEL:  ${{ secrets.OPENAI_MODEL }}      # default gpt-4.1

          # Telegram & GitHub tokens
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}

          # Context
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          GITHUB_SHA:        ${{ github.sha }}
